version: '3.8'

services:
  proxybox:
    image: golang:1.24-alpine
    container_name: proxybox
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./data:/app/data
      - ./bin:/app/bin
    ports:
      - "8080:8080"
      - "9001-9020:9001-9020"
    command: >
      sh -c "
        apk add --no-cache curl gzip ca-certificates &&
        if [ ! -f /app/bin/mihomo ]; then
          mkdir -p /app/bin &&
          curl -sL https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-linux-amd64-v1.19.34.gz -o /tmp/m.gz &&
          gzip -d /tmp/m.gz && mv /tmp/m /app/bin/mihomo && chmod +x /app/bin/mihomo ;
        fi &&
        ./proxybox -addr :8080 -data /app/data -mihomo /app/bin/mihomo
      "
